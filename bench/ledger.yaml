  - id: kit-drawer-snap-overlay
    title: при снап-точках библиотека не красит подложку, кит красит
    side: kit
    status: accepted
    decided: 2026-09-19
    reason: "При снап-точках библиотека (vaul) гасит подложку, пока ящик не дошёл до последней точки, и высоту панели берёт из точки; кит рисует подложку безусловно, а высоту по содержимому (замер: над панелью у приложения цвет фона страницы, у кита фон с подложкой; высота 370 против 230). Решение человека 2026-09-19: обе страницы со снап-точками сняты со стенда целиком, а не приняты числом. Довод: snapPoints — проп поведения, перетаскивание между точками, и его статический вид выводится только из семантики vaul, а не из разметки. Покрытие не страдает: оставшиеся восемь пар drawer проверяют все четыре направления и inset, тогда как снап-страницы держали 31,7 % дифа всего прогона. Запись оставлена как измеренное знание: если снап-точки вернутся, механизм уже назван. Цена: ящик со снап-точками в макете будет с подложкой и высотой по содержимому."
    report: замер 2026-09-19 после раунда 56
    files: [components/overlays/Drawer.jsx]
    components: [drawer--bottom-snap, drawer--right-snap]

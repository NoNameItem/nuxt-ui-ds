    reason: "Сглаживание скруглённого угла залитой плашки расходится одиночными пикселями при совпавшей до тысячных геометрии: у badge коробки, radius 6px, фон и box-shadow одинаковы, а край скругления даёт по 11 точек в каждой теме; у dashboard-navbar.light 2 точки, у dashboard-toolbar.light 1 (угол зелёной кнопки). Остаток нестабилен: badge.dark бывал и 0, и 11 без правки кита. Принято шумом решением человека 2026-09-23 на вопрос «принимаем эти четыре пары как шум?»: «да, принимаем». Цена: одиночные точки на краях плашек не отличить от настоящего расхождения по одной сумме — смотреть надо регион."

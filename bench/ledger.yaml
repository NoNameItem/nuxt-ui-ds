    reason: "У Editor кита нет Tiptap: у библиотеки дерево div[root] > EditorContent[content] > ProseMirror[base], у кита один узел с data-slot=root. Замер на шести примерах doc-страницы: классы корня кита — ровно root ∪ base темы editor, ничего лишнего и ничего не недостаёт; modelValue не рисуется. Принято как отклонение решением человека 2026-09-24: «эдитор принимаем как отклонение». Пар стенда нет — editor исключён из стенда, и отклонение видно только в приёмке тем, где оно записано как ACCEPTED_PAINT в pipeline/audit/props.mjs: ожидание корня — склейка root и base, и любое другое отклонение Editor остаётся расхождением. Цена: в макете редактор — статичный блок без содержимого и без узла content."

  - id: kit-changelog-out-of-scope
    title: ChangelogVersion и ChangelogVersions выводятся из кита — выравнивать не будем
    side: kit
    status: accepted
    decided: 2026-09-19
    reason: "ChangelogVersion и ChangelogVersions выведены из кита решением человека 2026-09-19: «по changelog-version/changelog-versions аналогично pricing-tables: нет смысла держать в ките, проще посмотреть, как это будет выглядеть в доке». Механизм расхождения с датой (сиблинг контейнера вместо двух точек ReuseDateTemplate) был найден и исправлен, но остаток после него — 134 111 пикселей на четырёх парах — механизмом не разобран, и разбирать его не стали. Компоненты удалены из кита, их страницы и артборды сняты со стенда, а пакет пропускает их через SKIP_COMPONENTS в pipeline/skip-dirs.mjs; запись класса остаётся как запись решения. Цена: для макетов журнала изменений компонента в ките нет, вид берут из документации Nuxt UI."
    report: решение человека 2026-09-19
    files: [ChangelogVersion.jsx, ChangelogVersions.jsx]
    components: [changelog-version, changelog-versions]
  - id: kit-pricing-out-of-scope
    title: всё семейство Pricing выводится из кита — выравнивать не будем
    side: kit
    status: accepted
    decided: 2026-09-19
    reason: "Всё семейство Pricing (PricingTable, PricingPlan, PricingPlans) выведено из кита решением человека. 2026-09-18 про PricingTable: «pricing-table весьма специфичный составной компонент, который вроде не сильно кастомизуется в nuxt ui (насколько помню, там кастомизируются только грейды цен). В целом мало смысла держать его в ките и точно не стоит тратить на него ресурсы по выравниванию»; 2026-09-19 решение расширено: «и в целом можно так же выкинуть всё семейство pricing». Повод: пара PricingTable за пять попыток правки выросла со 178 902 до 1 594 521 пикселя, счётчики узлов внутри колебались в обе стороны, и дальнейшие попытки были бы монеткой. Компоненты удалены из кита, их страницы и артборды сняты со стенда, пакет пропускает их через SKIP_COMPONENTS в pipeline/skip-dirs.mjs. Два найденных механизма (кнопка плана без block и size lg, цена в body при вертикальной ориентации) остаются в регистре закрытыми: это настоящие дефекты кита, которые больше не разрабатываются. Цена: для макетов с тарифами компонента в ките нет, вид берут из документации Nuxt UI."
    report: 2026-09-18#решение-по-pricing-table
    files: [PricingTable.jsx, PricingPlan.jsx, PricingPlans.jsx]
    components: [pricing-table, pricing-plan, pricing-plans]

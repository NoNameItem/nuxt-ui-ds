  - id: stand-toast-progress-time
    title: длина полосы прогресса у приложения зависит от момента снимка
    side: ours
    status: accepted
    decided: 2026-09-23
    reason: "Длина полосы прогресса тоста у приложения зависит от момента снимка: UProgress показывает долю оставшегося времени, к снимку проходит около 1,5 с из duration 60000, и конец полосы на 11 px короче; у кита времени нет, и полоса полная. Около 10 точек на каждую полосу, на всех парах тостов и тостера. Принято тем же решением человека 2026-09-23, что и стопка тостов: «по тостам можем принять и сказать, что все ок, я визуально не вижу важной разницы, тосты в ките достаточно репрезентативны для использования в макетах». duration стенда не меняли, хотя увеличение на порядки свело бы сдвиг к долям пикселя. Цена: пиксели вне сверки у этих пар плавают от прогона к прогону."

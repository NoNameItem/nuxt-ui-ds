  - id: kit-hover-not-reproduced
    title: состояние hover кит не воспроизводит — принято нормой
    side: kit
    status: accepted
    decided: 2026-09-18
    reason: "Состояние наведения кит не воспроизводит, и это принято нормой решением человека 2026-09-18: «в целом мы можем принять то, что в ките не работает hover как норму и не зацикливаться». Конкретно: два правила tokens/utilities.css — group-hover:ring-primary и group-hover/blog-post:shadow-none — пишут box-shadow напрямую вместо своей переменной и вытесняют соседа; остальные правила того же дефекта исправлены (класс kit-shadow-ring). Пункт трижды отправлялся платформе, и в последний раз она отчиталась о выполнении, а файл остался байт в байт прежним. Пиксельного следа нет по построению: стенд снимает статические страницы, наведение в кадр не попадает ни на одной стороне, поэтому пар у класса нет — принимается механизм, а не число. Цена: расхождение проявится в первом сценарии, где hover попадёт в снимок."
    report: 2026-09-18#раунд-4
    files: [tokens/utilities.css]

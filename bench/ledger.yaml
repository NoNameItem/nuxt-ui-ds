  - id: kit-toaster-stack-in-flow
    title: стопка тостера в потоке с gap, а не absolute с transform — значок второго тоста растеризуется иначе
    side: kit
    status: accepted
    decided: 2026-09-23
    reason: "Стопка тостов у кита лежит в потоке (flex column-reverse с gap 16), у библиотеки каждый тост стоит absolute со своим transform. Координаты совпадают до сотых, но сдвинутые тосты растеризуются иначе: около 13 точек значка у верхних тостов и строка текста около 10 точек у нижних, на каждой паре тостера. Опыт показал, что раскладка библиотеки в ките убирает и значок, и строку, но править не стали. Принято решением человека 2026-09-23: «по тостам можем принять и сказать, что все ок, я визуально не вижу важной разницы, тосты в ките достаточно репрезентативны для использования в макетах». Цена: единичные точки сглаживания у сдвинутых тостов."
    report: замер 2026-09-23 после раунда 110
    files: [components/overlays/Toaster.jsx]

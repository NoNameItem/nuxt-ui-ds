    title: глифы у сторон из разных источников, кит-сторона невоспроизводима по построению
    side: construction
    status: accepted
    decided: 2026-09-24
    reason: "Глифы иконок стороны берут из разных источников: приложение — из @iconify-json/lucide в node_modules, кит — через iconify-icon@3 с CDN в рантайме, строя из рисунка маску (lib/iconify.jsx). Сейчас источники синхронны: все пары с иконками в нуле. Это риск на будущее, а не текущая находка, и принят он решением человека 2026-09-24: «давай все примем и закончим уже». Цена: если набор Lucide на CDN уйдёт вперёд относительно установленного пакета, пары с иконками разойдутся без всякой правки кита, и причину надо будет искать здесь."

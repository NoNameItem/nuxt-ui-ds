<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@3/dist/iconify-icon.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
</head><body class="bg-default text-default">
<div id="root"></div>
<script type="text/babel">
const { Button } = window.NuxtUIDesignSystem_69ebe5;
const Row = ({ label, children }) => (
  <div className="flex items-center gap-2 flex-wrap">
    <span className="w-14 shrink-0 text-[10px] uppercase tracking-wide text-dimmed">{label}</span>
    {children}
  </div>
);
const Panel = ({ dark }) => (
  <div className={(dark ? 'dark text-default ' : '') + 'flex-1 bg-default p-4 flex flex-col gap-3'}>
    <Row label="variant">
      {['solid','outline','soft','subtle','ghost','link'].map(v => <Button key={v} variant={v} label={v} />)}
    </Row>
    <Row label="color">
      {['primary','secondary','success','info','warning','error','neutral'].map(c => <Button key={c} color={c} label={c} />)}
    </Row>
    <Row label="size">
      {['xs','sm','md','lg','xl'].map(s => <Button key={s} size={s} label={s} icon="i-lucide-rocket" />)}
    </Row>
    <Row label="state">
      <Button label="loading" loading trailingIcon="i-lucide-loader-circle" />
      <Button label="disabled" disabled />
      <Button square icon="i-lucide-plus" />
      <Button color="neutral" variant="outline" label="trailing" trailingIcon="i-lucide-arrow-right" />
    </Row>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="flex min-h-[300px]"><Panel /><Panel dark /></div>
);
</script>

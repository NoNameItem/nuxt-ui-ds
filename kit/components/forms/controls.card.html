<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@3/dist/iconify-icon.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
</head><body class="bg-default text-default">
<div id="root"></div>
<script type="text/babel">
const { Checkbox, RadioGroup, Switch, Slider, InputRating, CheckboxGroup, ColorPicker, ProgressGroup } = window.NuxtUIDesignSystem_69ebe5;
const L = ({ children, t }) => (<div className="flex flex-col gap-2"><span className="text-[10px] uppercase tracking-wide text-dimmed">{t}</span><div className="flex items-start gap-2 flex-wrap">{children}</div></div>);
const Panel = ({ dark }) => (
  <div className={(dark ? 'dark text-default ' : '') + 'flex-1 min-w-0 bg-default p-4 flex flex-col gap-4'}>
    <L t="checkbox">{<div className="flex flex-col gap-2"><Checkbox label="Unchecked" /><Checkbox label="Checked" checked /><Checkbox label="Indeterminate" indeterminate /><Checkbox label="Card variant" variant="card" checked color="success" class="p-3" /></div>}</L>
    <L t="radio">{<RadioGroup items={[{ label: 'One', value: '1', active: true }, { label: 'Two', value: '2' }]} />}</L>
    <L t="switch">{<div className="flex items-center gap-4">{['xs','sm','md','lg','xl'].map(s => <Switch key={s} size={s} checked />)}<Switch color="warning" /></div>}</L>
    <L t="slider / rating">{<div className="w-64 flex flex-col gap-4"><Slider value={40} /><Slider value={70} color="success" size="lg" /><InputRating value={3} /></div>}</L>
    <L t="checkbox-group — value from the group">{<CheckboxGroup class="w-full" defaultValue={['weekly', 'product']} items={[{ label: 'Weekly digest', value: 'weekly' }, { label: 'Product news', value: 'product' }, { label: 'Security alerts', value: 'security' }]} />}</L>
    <L t="progress-group — dot or icon, never both">{<ProgressGroup class="w-full" items={[{ label: 'Uploading', value: 40 }, { label: 'Verified', icon: 'i-lucide-check', value: 80 }]} />}</L>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<div className="flex items-stretch min-h-full"><Panel /><Panel dark /></div>);
</script>
</body></html>

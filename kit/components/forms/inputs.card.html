<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head><body class="bg-default text-default">
<div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, SelectMenu, InputMenu, InputNumber, InputTags, PinInput, InputDate, FormField, FileUpload } = window.NuxtUIDesignSystem_69ebe5;
const L = ({ children, t }) => (<div className="flex flex-col gap-2"><span className="text-[10px] uppercase tracking-wide text-dimmed">{t}</span><div className="flex items-start gap-2 flex-wrap">{children}</div></div>);
const Panel = ({ dark }) => (
  <div className={(dark ? 'dark text-default ' : '') + 'flex-1 min-w-0 bg-default p-4 flex flex-col gap-4'}>

    <L t="textarea / select">{<div className="w-full grid grid-cols-2 gap-2"><Textarea placeholder="textarea.ts" /><Select placeholder="Select…" /></div>}</L>
    <L t="number / tags">{<div className="w-full grid grid-cols-2 gap-2"><InputNumber defaultValue={5} /><InputTags defaultValue={['vue', 'nuxt']} /></div>}</L>
    <L t="field">{<div className="w-full"><FormField label="Email" description="We never share it." required><Input placeholder="you@example.com" /></FormField></div>}</L>

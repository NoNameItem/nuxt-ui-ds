<!-- @dsCard group="Colors" viewport="700x140" name="Border & ring roles" subtitle="ring-default / -muted / -accented / -inverted — drawn as inset shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="padding:14px;display:flex;gap:10px"><div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--ui-border)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">ring-default</div></div><div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--ui-border-muted)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">ring-muted</div></div><div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--ui-border-accented)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">ring-accented</div></div><div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--ui-border-inverted)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">ring-inverted</div></div></div></body></html>

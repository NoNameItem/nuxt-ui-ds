<!-- @dsCard group="Brand" viewport="700x160" name="Light & dark" subtitle="One .dark class re-points every --ui-* role; components never branch" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="display:flex"><div class="" style="flex:1;background:var(--ui-bg);padding:16px;display:flex;flex-direction:column;gap:8px"><div style="font:600 13px var(--font-sans);color:var(--ui-text-highlighted)">.light / :root</div><div style="display:flex;gap:6px"><span style="padding:5px 10px;border-radius:var(--radius-md);background:var(--ui-primary);color:var(--ui-text-inverted);font:500 12px var(--font-sans)">Solid</span><span style="padding:5px 10px;border-radius:var(--radius-md);background:var(--ui-bg-elevated);color:var(--ui-text);box-shadow:inset 0 0 0 1px var(--ui-border);font:500 12px var(--font-sans)">Subtle</span></div><div style="font:400 11px var(--font-sans);color:var(--ui-text-muted)">bg-default · text-muted · ring-default</div></div><div class="dark bg-default text-default" style="flex:1;background:var(--ui-bg);padding:16px;display:flex;flex-direction:column;gap:8px"><div style="font:600 13px var(--font-sans);color:var(--ui-text-highlighted)">.dark</div><div style="display:flex;gap:6px"><span style="padding:5px 10px;border-radius:var(--radius-md);background:var(--ui-primary);color:var(--ui-text-inverted);font:500 12px var(--font-sans)">Solid</span><span style="padding:5px 10px;border-radius:var(--radius-md);background:var(--ui-bg-elevated);color:var(--ui-text);box-shadow:inset 0 0 0 1px var(--ui-border);font:500 12px var(--font-sans)">Subtle</span></div><div style="font:400 11px var(--font-sans);color:var(--ui-text-muted)">bg-default · text-muted · ring-default</div></div></div></body></html>

<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Flat by default: surfaces are tinted, shadows appear on overlays only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="padding:14px;display:flex;gap:12px"><div style="flex:1"><div style="height:56px;border-radius:var(--radius-lg);background:var(--ui-bg);box-shadow:inset 0 0 0 1px var(--ui-border);"></div><div style="font:500 10px var(--font-mono);color:var(--ui-text-toned);margin-top:8px">flat</div><div style="font:400 9px var(--font-sans);color:var(--ui-text-dimmed)">bg-elevated/50 + ring</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-lg);background:var(--ui-bg);box-shadow:0 1px 2px 0 rgb(0 0 0/.05);"></div><div style="font:500 10px var(--font-mono);color:var(--ui-text-toned);margin-top:8px">shadow-sm</div><div style="font:400 9px var(--font-sans);color:var(--ui-text-dimmed)">dropdown, popover</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-lg);background:var(--ui-bg);box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);"></div><div style="font:500 10px var(--font-mono);color:var(--ui-text-toned);margin-top:8px">shadow-lg</div><div style="font:400 9px var(--font-sans);color:var(--ui-text-dimmed)">modal, switch thumb</div></div></div></body></html>

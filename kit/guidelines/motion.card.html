<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="padding:14px;display:flex;flex-direction:column;gap:8px;font:400 11px var(--font-sans);color:var(--ui-text-toned)"><div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font:500 10px var(--font-mono);color:var(--ui-text-dimmed)">transition</span>transition-colors · duration-200 · ease-out</div><div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font:500 10px var(--font-mono);color:var(--ui-text-dimmed)">overlays</span>scale-in / scale-out · fade-in / fade-out</div><div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font:500 10px var(--font-mono);color:var(--ui-text-dimmed)">panels</span>slide-in-from-{top,right,bottom,left}(-and-fade)</div><div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font:500 10px var(--font-mono);color:var(--ui-text-dimmed)">disclosure</span>accordion-down / collapsible-up</div><div style="display:flex;gap:8px;align-items:center"><span style="width:110px;font:500 10px var(--font-mono);color:var(--ui-text-dimmed)">reduced motion</span>every keyframe degrades to a plain fade</div><div style="height:6px;border-radius:999px;background:linear-gradient(90deg,var(--ui-primary),transparent);animation:shimmer 2s linear infinite"></div></div></body></html>

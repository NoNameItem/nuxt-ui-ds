<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="padding:14px;display:flex;gap:10px;align-items:flex-end"><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-xs)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">xs<br>0.5×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-sm)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">sm<br>1×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-md)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">md<br>1.5×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-lg)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">lg<br>2×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-xl)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">xl<br>3×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-2xl)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">2xl<br>4×</div></div><div style="flex:1;text-align:center"><div style="height:52px;background:var(--ui-bg-elevated);box-shadow:inset 0 0 0 1px var(--ui-border);border-radius:var(--radius-3xl)"></div><div style="font:400 9px var(--font-mono);color:var(--ui-text-muted);margin-top:6px">3xl<br>6×</div></div></div></body></html>

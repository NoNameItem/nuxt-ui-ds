<!-- @dsCard group="Brand" viewport="700x170" name="Ring, not border" subtitle="Nuxt UI draws edges with inset box-shadow so layout never shifts" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body class="bg-default text-default"><div style="padding:14px;display:flex;gap:16px;align-items:center"><div style="flex:1"><div style="padding:14px;border-radius:var(--radius-lg);background:var(--ui-bg);box-shadow:inset 0 0 0 1px var(--ui-border);font:400 12px var(--font-sans);color:var(--ui-text-toned)">ring ring-default<br><span style="color:var(--ui-text-dimmed)">0 layout cost</span></div></div><div style="flex:1"><div style="padding:14px;border-radius:var(--radius-lg);background:var(--ui-bg);box-shadow:inset 0 0 0 2px var(--ui-primary);font:400 12px var(--font-sans);color:var(--ui-text-toned)">ring-2 ring-primary<br><span style="color:var(--ui-text-dimmed)">focus-visible treatment</span></div></div><div style="flex:1"><div style="padding:14px;border-radius:var(--radius-lg);background:var(--ui-bg);border:1px solid var(--ui-border);font:400 12px var(--font-sans);color:var(--ui-text-toned)">border-1<br><span style="color:var(--ui-text-dimmed)">only where the theme says border</span></div></div></div></body></html>

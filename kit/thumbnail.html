<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0;height:100%}.tile{width:100vw;height:100vh;display:flex}.main{flex:1;background:var(--ui-color-primary-500);display:flex;align-items:center;justify-content:center}.mark{font:700 min(150px,14vw)/1 var(--font-sans);letter-spacing:-.04em;color:#fff;white-space:nowrap}.strip{width:25%;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head><body><div class="tile">
<div class="main"><span class="mark">Nuxt UI</span></div>
<div class="strip">
<div style="background:var(--ui-color-warning-400)"></div>
<div style="background:var(--ui-color-error-500)"></div>
<div style="background:var(--ui-color-info-600)"></div>
<div style="background:var(--ui-color-neutral-900)"></div>
</div></div></body></html>
